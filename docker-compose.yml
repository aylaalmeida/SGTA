services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sgta
      POSTGRES_USER: ayla
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: sgta
      POSTGRES_USER: baltar
      POSTGRES_PASSWORD: 123456
      POSTGRES_HOST: db
    depends_on:
      - db

volumes:
  postgres_data: